<svg xmlns="http://www.w3.org/2000/svg" width="270" height="270" viewBox="0 0 270 270">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f6f2"/>
      <stop offset="100%" stop-color="#eae4dc"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="270" height="270" fill="url(#bgGrad)"/>
  
  <!-- Subtle border -->
  <rect x="1" y="1" width="268" height="268" fill="none" stroke="#ded6cc" stroke-width="2"/>
  
  <!-- Teacher Silhouette Group -->
  <g fill="#a89d91" transform="translate(135, 115)">
    <!-- Head -->
    <circle cx="0" cy="-25" r="42"/>
    
    <!-- Shoulders and Torso -->
    <path d="M -65 65 C -65 25 -40 15 0 15 C 40 15 65 25 65 65 C 65 85 -65 85 -65 65 Z"/>
  </g>
  
  <!-- Educational / Faculty Badge Accent -->
  <g fill="#2c2b5e" opacity="0.8" transform="translate(135, 230)">
    <text font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#7d7266" letter-spacing="1.5">FACULTY</text>
  </g>
</svg>